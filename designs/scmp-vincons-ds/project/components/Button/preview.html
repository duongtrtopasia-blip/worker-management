<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body style="margin:0;padding:16px;background:var(--surface);font-family:var(--font-sans)">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
  <button class="vc-btn vc-btn--primary" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Thêm công nhân</button>
  <button class="vc-btn vc-btn--secondary" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Xuất Excel</button>
  <button class="vc-btn vc-btn--ghost" type="button">Hủy</button>
  <button class="vc-btn vc-btn--danger" type="button">Xóa</button>
  <button class="vc-btn vc-btn--primary" type="button" disabled>Đang lưu…</button>
</div>
<div style="display:flex;gap:8px;align-items:center;margin-top:16px">
  <button class="vc-btn vc-btn--secondary vc-btn--sm" type="button">Sửa</button>
  <button class="vc-btn vc-btn--ghost vc-btn--icon" type="button" aria-label="In thẻ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg></button>
</div>
<script></script>
</body>
</html>
