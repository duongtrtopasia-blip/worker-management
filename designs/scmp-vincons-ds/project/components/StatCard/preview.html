<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatCard — preview</title></head>
<body style="margin:0;padding:16px;background:var(--canvas);font-family:var(--font-sans)">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
  <a class="vc-card vc-card--link vc-stat" href="#" style="text-decoration:none">
    <div class="vc-stat__top"><span class="vc-stat__label">Tổng công nhân</span><span class="vc-stat__icon" style="background:var(--brand-blue-soft);color:var(--brand-blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 9M22 21v-1a6 6 0 0 0-4-5.6"/></svg></span></div>
    <span class="vc-stat__value">[SỐ]</span><span class="vc-stat__sub">Đã đăng ký trên hệ thống</span>
  </a>
  <a class="vc-card vc-card--link vc-stat" href="#" style="text-decoration:none">
    <div class="vc-stat__top"><span class="vc-stat__label">Thẻ sắp hết hạn</span><span class="vc-stat__icon" style="background:var(--warning-soft);color:var(--warning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span></div>
    <span class="vc-stat__value">[SỐ]</span><span class="vc-stat__sub">Trong 30 ngày tới</span>
  </a>
  <a class="vc-card vc-card--link vc-stat" href="#" style="text-decoration:none">
    <div class="vc-stat__top"><span class="vc-stat__label">Thiếu hồ sơ</span><span class="vc-stat__icon" style="background:var(--danger-soft);color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span></div>
    <span class="vc-stat__value">[SỐ]</span><span class="vc-stat__sub">Chưa có ảnh chân dung</span>
  </a>
</div>
<script></script>
</body>
</html>
